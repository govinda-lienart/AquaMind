    - 14
    - 17

# log_artifact_mlflow_script
log_artifact_mlflow:
  run_path: runs/aquamind_yolov8_run_5r_8c_9r_10r_11c_14c_2026_07_21_2107_20260721_1518
  dataset_name: dataset_ann_5r_8c_9r_10r_11c_14c_2026_07_21_2107   # the dataset THIS run was trained on — pin it here so provenance stays truthful even after prepare_dataset moves on to a new dataset

# ml_backend_script — YOLO model used by LabelStudio for self-labeling (pre-labeling).
# Decoupled from fish_tracker on purpose: set whichever model you want to pre-label with here.
ml_backend:
  model_path: models:/aquamind-yolo-detector@champion   # registry alias → resolved to native YOLO by scripts.model_registry.load_yolo (was: runs/.../2026_07_20_.../weights/best.pt)

# tracker_script (tracker.py)
tracker:
  input_video_path:  videos/IMG_1839.MOV
  model_path:        models:/aquamind-yolo-detector@champion   # was: runs/.../2026_07_21_.../weights/best.pt — now resolved via scripts.model_registry.load_yolo
  output_video_path: output_fish_tracker/tracker_IMG_1839_appearance   # a dated '_basic_<timestamp>' folder is created per run
  start_seconds:     0    # start video
  end_seconds:       60   # end video, choose 'null' for the whole video
  num_fish:          5
  calibration_secs:  5    # seconds to watch before assigning fish IDs (reflections disappear, real fish stay)
  max_distance:      150   # max pixels between predicted and detected position to count as a match
  merge_fix:         true   # hold IDs through a detector MERGE crossing: freeze velocity through a blob (don't let the merged centroid bend the trajectory) + coast lost fish on their clean momentum (frame-capped). false = plain geometry. Toggle off if it destabilises.
  appearance:          true          # fuse DINOv2 appearance into matching (helps hold IDs at crossings); false = geometry only
  appearance_weight:   100            # px per unit cosine-distance — how strongly appearance can tip an ambiguous match (only when appearance: true)
  appearance_min_sep:  150            # only refresh a fish's appearance memory when it is this far (px) from ALL others — stops overlap crops poisoning it
  appearance_gate:                     # VETO threshold — OFF. Tried 0.30 (data-tuned) and it caused long ghost frames (fish boxless ~10s): a refused fish drifts past geometry's reach while ghosting, then can't re-acquire. Veto-at-a-crossing is not worth the ghost spiral. Leave blank.
  appearance_max_gap_secs: 2.5         # trust appearance only within this many seconds (measured ~2s hold-time for the contrastive embedding); a fish hidden longer -> geometry only (stale memory has drifted)
  appearance_debug:  true              # draw per-fish g (geometry px) + a (appearance cosine-dist) under each box + red "APP" when appearance FLIPPED the match; run-end logs how many flips (0 = appearance never mattered -> geometry alone suffices)
  appearance_audit:  true              # POST-CROSSING SWAP AUDIT: after a fish exits a crossing, cross-check its look vs its OWN pre-crossing memory vs other fish's -> flags "?SWAP N" + logs appearance_swap_flag. FLAG only (doesn't act); measure precision, then decide on auto-correct.
  appearance_audit_margin: 0.03        # flag when the exit is this-much MORE similar (cosine) to another fish's memory than its own. Higher = fewer/more-confident flags.
  appearance_backbone: dinov2_vits14  # embedder used when NO head is given (raw DINOv2 — weak cosine)
  appearance_head:     output_fish_tracker/tracker_IMG_1839_basic_2026_07_23_1202/stitch/contrastive_head.pt   # CONTRASTIVE projection head -> discriminative short-range identity metric; blank = raw DINOv2

