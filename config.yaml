
# extract_frames_script
extract_frames:
  video_path:     output_fish_tracker/tracker_IMG_1231__2026_07_21_2055/tracker_IMG_1231__2026_07_21_2055.mp4# videos/test.MOV
  frames_dir:     frames
  sample_rate:    1     # frames per second to extract (1=1fps, 2=2fps, 60=every frame) — used only in window mode
  start_seconds:  0     # leave 0 for beginning of video — window mode
  end_seconds:    null  # leave null for full video — window mode
  # frame_ranges: multi-range mode. When set (non-empty), overrides the seconds/sample_rate window above.
  # Each [start, end] is INCLUSIVE and in FRAME NUMBERS; every frame in the range is saved (no sampling).
  # A single frame = [n, n]. Leave null/empty to use window mode instead.
  frame_ranges:   null
  # frame_ranges:
  #   - [100, 200]
  #   - [240, 240]
  #   - [300, 400]

# download_labelstudio_script
download_labelstudio:
  project_name: crossing_IMG_2349_second_part_hard_mining    # Label Studio project name
  min_task_id:                           # leave empty for no lower limit
  max_task_id:                            # leave empty for no upper limit
  mode: export                           # export or search
  search_term: frame_2220                # used only when mode = search
  export_labels: false                    # download YOLO .txt label files into labels/ folder
  export_images: true                    # download source images into images/ folder

# upload_labelstudio_script - hard negative mining - upload crossing frames to LabelStudio
upload_labelstudio:
  project_name: crossing_IMG_2349_second_part
  frames_dir: frames/crossing_frames_IMG_2349_20260721_16h30

