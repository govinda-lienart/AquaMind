
# extract_frames_script
extract_frames:
  video_path:     videos/IMG_0909.MOV # videos/test.MOV
  frames_dir:     frames
  sample_rate:    1     # frames per second to extract (1=1fps, 2=2fps, 60=every frame)
  start_seconds:  0     # leave 0 for beginning of video
  end_seconds:    null  # leave null for full video

# download_labelstudio_script
download_labelstudio:
  project_name: crossing_IMG_2349_hard_mining    # Label Studio project name
  min_task_id:                           # leave empty for no lower limit
  max_task_id:                            # leave empty for no upper limit
  mode: export                           # export or search
  search_term: frame_2220                # used only when mode = search
  export_labels: true                    # download YOLO .txt label files into labels/ folder
  export_images: frames_folder                    # download source images into images/ folder

# upload_labelstudio_script - hard negative mining - upload crossing frames to LabelStudio
upload_labelstudio:
  project_name: crossing_IMG_2349
  frames_dir: frames/crossing_frames_IMG_2349_20260720_09h50   

# store_annotations_script
store_annotations:
  labels_path: labelstudio_download/labelstudio_IMG_2349_hard_mining_20072026_10h51/labels
  frames_folder: frames/crossing_frames_IMG_2349_20260720_09h50
  video_name: IMG_2349
  frame_source: crossing_event   # regular | crossing_event (the frames folder's sidecar overrides this)
  notes: hard negative mining — 73 crossing frames, YOLO pre-labeled + manually corrected

# prepare_dataset_script
prepare_dataset:
  dataset_name: dataset_ann_5r_8c_9r_10r_11c_2026_06_20_1107
  annotation_set_ids:   # integer IDs from annotation_sets table — run store_annotations.py first
    - 5
    - 8
    - 9
    - 10
    - 11

# log_artifact_mlflow_script
log_artifact_mlflow:
  run_path: runs/aquamind_yolov8_run_an_3r_4r_5r_8c_2026_06_20_2121_20260630_1434
  # dataset: it reads the dataset listed in prepare dataset to pull the sidecar metadata from this dataset 

# fish_tracker_script
fish_tracker:
  input_video_path:  videos/IMG_2349.MOV
  model_path:        runs/aquamind_yolov8_run_an_3r_4r_5r_8c_2026_06_20_2121_20260630_1434/weights/best.pt
  output_video_path: output_fish_tracker/stage5_tracker_IMG_2349_as_3r_4r_5r_8c_2026_07_06_1853.mp4
  start_seconds:     0    # start video
  end_seconds:       130 # end video choose'null' for the whole video
  num_fish:          4
  calibration_secs:  10    # seconds to watch before assigning fish IDs (reflections disappear, real fish stay)
  max_distance:      150   # max pixels between predicted and detected position to count as a match
  confirm_hits:      200   # frames a detection must persist to get a permanent fish ID (~3 sec at 60fps, outlasts reflections)
  max_missing:       300   # frames a tentative track can disappear before being dropped
  show_trail:        true  # draw each fish's recent path as a colored trail
  trail_length:      300   # e.g. 150 = keep last 150 frames of trail per fish; null = keep the entire video's trail (in-memory only, never saved to disk)
  show_frame_number: true # # burn the frame number onto the video - I need to set to false to disable


# analyse_behaviour_script
analyse_behaviour:
  video: IMG_2349
  videos:
    IMG_2349: 
      parquet_path: output_fish_tracker/stage5_tracker_IMG_2349_as_3r_4r_5r_8c_2026_07_06_1853/tracks.parquet
      tank_width_px: 1815
      tank_width_cm: 48.5  # inner wall to inner wall, remeasured 2026-07-19 (was wrongly 35)
      surface_y_px: 273    # front-waterline y in video pixels (depth 0%); measured with throwaway/pixel_measure.py
      bottom_y_px: 971     # tank-bottom y in video pixels (depth 100%); measured with throwaway/pixel_measure.py
      calibration_secs: 10 # skip tracker warm-up window (matches fish_tracker confi

#_______________________________________________________
# extract_crossing_frames_script - hard negative mining
extract_crossing_frames:
  video_path: videos/IMG_2349.MOV
  log_path:       output_fish_tracker/stage5_tracker_IMG_2349_as_3r_4r_5r_8c_2026_07_06_1853/stage5_tracker_IMG_2349_as_3r_4r_5r_8c_2026_07_06_1853.log
  output_dir:     frames/crossing_frames
  iou_threshold:  0.4   # minimum IoU to count as a crossing event (0=any overlap, 1=full overlap)
  dedup_window:   5     # minimum frames between two crossing events to treat them as separate

