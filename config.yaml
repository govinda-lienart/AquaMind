# log_artifact_mlflow_script
log_artifact_mlflow:
  run_path: runs/aquamind_yolov8_run_ann_5r_8c_9r_10r_11c_2026_07_20_1107_20260720_0440
  # dataset: it reads the dataset listed in prepare dataset to pull the sidecar metadata from this dataset 

# ml_backend_script — YOLO model used by LabelStudio for self-labeling (pre-labeling).
# Decoupled from fish_tracker on purpose: set whichever model you want to pre-label with here.
ml_backend:
  model_path: runs/aquamind_yolov8_run_ann_5r_8c_9r_10r_11c_2026_07_20_1107_20260720_0440/weights/best.pt

# fish_tracker_script
fish_tracker:
  input_video_path:  videos/IMG_1839.MOV
  model_path:        runs/aquamind_yolov8_run_ann_5r_8c_9r_10r_11c_2026_07_20_1107_20260720_0440/weights/best.pt
  output_video_path: output_fish_tracker/tracker_IMG_1839
  start_seconds:     0    # start video
  end_seconds:       none # end video choose'null' for the whole video
  num_fish:          5
  calibration_secs:  10    # seconds to watch before assigning fish IDs (reflections disappear, real fish stay)
  max_distance:      150   # max pixels between predicted and detected position to count as a match
  confirm_hits:      90    # frames a detection must persist to get a permanent fish ID (~1.5s at 60fps). Lowered from 200: reflections are class-1 and filtered out before the tracker, so long persistence isn't needed to outlast them; 90 still rejects transient blobs while letting dark-zone fish confirm in time.
  max_missing:       300   # frames a tentative track can disappear before being dropped
  show_trail:        true  # draw each fish's recent path as a colored trail
  trail_length:      300   # e.g. 150 = keep last 150 frames of trail per fish; null = keep the entire video's trail (in-memory only, never saved to disk)
  show_frame_number: true # # burn the frame number onto the video - I need to set to false to disable

# basic_tracker_script (tracker_basic.py)
basic_tracker:
  input_video_path:  videos/IMG_1839.MOV
  model_path:        runs/aquamind_yolov8_run_ann_5r_8c_9r_10r_11c_2026_07_20_1107_20260720_0440/weights/best.pt
  output_video_path: output_fish_tracker/tracker_IMG_1839   # a dated '_basic_<timestamp>' folder is created per run
  start_seconds:     0    # start video
  end_seconds:       null   # end video, choose 'null' for the whole video
  num_fish:          5
  calibration_secs:  5    # seconds to watch before assigning fish IDs (reflections disappear, real fish stay)
  max_distance:      150   # max pixels between predicted and detected position to count as a match

