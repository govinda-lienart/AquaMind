
# extract_frames_script
extract_frames:
  video_path: videos/IMG_1189.MOV # videos/test.MOV
  frames_dir: frames

# export_labelstudio_script
export_labelstudio:
  project_name: AquaMind_IMG_0764     # Label Studio project name
  export_type: pose                      # pose or bbox
  min_task_id:                           # leave empty for no lower limit
  max_task_id:                            # leave empty for no upper limit
  mode: export                           # export or search
  search_term: frame_2220                # used only when mode = search

# store_annotations_script
store_annotations:
  labels_path: labelstudio_export/labelstudio_pose_IMG_0764_11062026_11h04/labels # test -> fixtures/labels
  frames_folder: frames/frames_IMG_0764_20260528_2116 # test -> frames/frames_test

# prepare_dataset_script
prepare_dataset:
  dataset_name: aquamind_dataset_IMG_0350_2026_07_14_1457
  mode: pose  # change to 'pose' for pose training or 'bbox'
  
  annotation_sessions:
    - labelstudio_pose_IMG_0350_11062026_08h50
    - labelstudio_pose_IMG_0764_11062026_11h04
    - labelstudio_pose_IMG_0909_11062026_10h35

# log_artifact_mlflow_script
log_artifact_mlflow:
  run_path: runs/aquamind_yolov8_run1_20260614_1446

# track_zebrafish_script
track_zebrafish:
  input_video_path: videos/IMG_0350.MOV
  model_path: mlruns/743689458392478771/06139b091bf54ead94c764df7693b7a1/artifacts/weights/best.pt
  output_video_path: output_video_zebratracker/tracker_IMG_0350_2026_05_31_14h49.mp4
  start_seconds: 0
  end_seconds: 60
  num_fish: 5
  max_distance: 150         # max pixels between prediction and detection to count as a match
  max_frame_step: 60        # max pixels a confirmed fish can move in one frame (prevents single-frame jumps)
  confirm_hits: 60          # frames a detection must persist before getting a permanent fish ID (1 sec at 60fps)
  min_displacement: 30      # min pixels a candidate must move from first detection to be confirmed (filters reflections)
  max_tentative_missing: 5  # frames a tentative (unconfirmed) track can disappear before being dropped

  

