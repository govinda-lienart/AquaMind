#_______________________________________________________
# extract_ghost_frames_script - hard negative mining by GHOSTING (active learning: mine where the tracker LOST a fish = YOLO failed)
extract_ghost_frames:
  log_path:   output_fish_tracker/tracker_IMG_1839_appearance_2026_08_04_0728/tracker_IMG_1839_appearance_2026_08_04_0728.log   # the tracker run to MINE
  video_path: videos/IMG_1839.MOV   # RAW source to cut frames from (never a tracker output)
  output_dir: frames                # a ghost_frames_<video>_<stamp> folder is created here
  per_burst:  3                     # frames sampled per ghosting burst (evenly spaced) — cuts redundancy; 0 = every ghosting frame (~765)

#_______________________________________________________
# extract_crossing_frames_script - hard negative mining
extract_crossing_frames:
  video_path: videos/IMG_2349.MOV
  log_path:       output_fish_tracker/stage5_tracker_IMG_2349__ann_5r_8c_9r_10r_11c_2026_07_20_1107/stage5_tracker_IMG_2349__ann_5r_8c_9r_10r_11c_2026_07_20_1107.log
  output_dir:     frames/crossing_frames
  iou_threshold:  0.4   # minimum IoU to count as a crossing event (0=any overlap, 1=full overlap)
  dedup_window:   5     # minimum frames between two crossing events to treat them as separate
  start_frame:    7791  # skip crossings at/below this frame (first ~2 min already labeled from the 2026_07_06 run); set 0 to extract from the start

#_______________________________________________________
# train_reid_script - Stage 6 per-video re-ID head (DINOv2 backbone + trained classifier head)
train_reid:
  video: IMG_1839
  videos:
    IMG_1839:
      crops_run:     output_fish_tracker/tracker_IMG_1839_basic_2026_07_23_1202   # tracker run whose curated_crops feed the classifier
      stretches:     ["04"]    # each stretch is trained + evaluated SEPARATELY (one MLflow run each) — never pooled, since cross-stretch fish IDs aren't verified
      backbone:      dinov2_vits14   # which pretrained model makes the 384-d fingerprints (feats from a different backbone are NOT comparable)
      num_epochs:    100             # frozen feats -> head trains fast, so we can afford many epochs
      lr:            0.001           # Adam step size
      batch_size:    32              # feats-per-batch for the head

#_______________________________________________________
# finetune_reid_script - Stage 6.4 UNFREEZE DINOv2 + train end-to-end (backbone learns; runs in the loop, no cache)
finetune_reid:
  video: IMG_1839
  videos:
    IMG_1839:
      crops_run:       output_fish_tracker/tracker_IMG_1839_basic_2026_07_23_1202
      stretches:       ["02"]          # per-stretch, never pooled (same identity-safety rule as train_reid)
      backbone:        dinov2_vits14
      num_epochs:      30
      head_lr:         0.001           # larger LR for the fresh head
      backbone_lr:     0.00001         # 1e-5 — SMALL, so we nudge (not wreck) DINOv2's pretrained weights
      batch_size:      32
      unfreeze_blocks: 2               # unfreeze the last N transformer blocks (fewer = less overfit on small data)

#_______________________________________________________
# contrastive_reid_script - Stage 6.5 SELF-SUPERVISED contrastive projection (idtracker.ai 2025 method)
# Learns identity features WITHOUT global labels: positives = same fragment (guaranteed same fish),
# negatives = COEXISTING fragments (different fish — can't be two places at once). Trains a projection
# head on cached frozen DINOv2 feats (fast, low overfit risk). Reads run_dir from train_reid.videos.
contrastive_reid:
  video: IMG_1839
  backbone:        dinov2_vits14   # must match the run used to build fragments (feats not comparable across backbones)
  out_dim:         64              # projection dimension (idtracker uses ~8; 64 clusters fine, tune down if it helps)
  temperature:     0.1             # SupCon softmax temperature (lower = sharper contrast)
  lr:              0.001           # Adam step size for the projection head
  steps:           3000            # training steps (each = one coexisting group; cheap on cached feats)
  crops_per_frag:  6               # crops sampled per fragment per batch (needs >=2 for positives)
  hidden_dim:      256             # projection MLP hidden width (384 -> hidden -> out_dim)
