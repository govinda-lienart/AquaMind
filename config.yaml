#_______________________________________________________
# extract_crossing_frames_script - hard negative mining
extract_crossing_frames:
  video_path: videos/IMG_2349.MOV
  log_path:       output_fish_tracker/stage5_tracker_IMG_2349__ann_5r_8c_9r_10r_11c_2026_07_20_1107/stage5_tracker_IMG_2349__ann_5r_8c_9r_10r_11c_2026_07_20_1107.log
  output_dir:     frames/crossing_frames
  iou_threshold:  0.4   # minimum IoU to count as a crossing event (0=any overlap, 1=full overlap)
  dedup_window:   5     # minimum frames between two crossing events to treat them as separate
  start_frame:    7791  # skip crossings at/below this frame (first ~2 min already labeled from the 2026_07_06 run); set 0 to extract from the start

#_______________________________________________________
# train_reid_script - Stage 6 per-video re-ID head (DINOv2 backbone + trained classifier head)
train_reid:
  video: IMG_1839
  videos:
    IMG_1839:
      crops_run:     output_fish_tracker/tracker_IMG_1839_basic_2026_07_23_1202   # tracker run whose curated_crops feed the cache
      stretches:     ["02"]          # which curated stretch(es) to train on. ONE stretch = swap-safe (IDs clean by construction, matches the embed_crops baseline). Add more ONLY after verifying cross-stretch ID consistency.
      backbone:      dinov2_vits14   # which pretrained model makes the 384-d fingerprints (feats from a different backbone are NOT comparable)
      features_path:                 # OPTIONAL prebuilt reid_features.pt — set it to LOAD a cache (skip the slow backbone); leave blank to BUILD a fresh timestamped cache
      num_epochs:    100             # cached feats -> head trains instantly, so we can afford many epochs
      lr:            0.001           # Adam step size
      batch_size:    32              # feats-per-batch for the head

